{% extends "base.html" %}
{% block title %}Verify Recovery Code — WatchNext{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <span class="logo-play">▶</span>
      <span class="logo-text">WatchNext</span>
    </div>

    <h1 class="auth-title">Enter your recovery code</h1>
    <p class="auth-sub">Enter the 4-digit code you set when you signed up.</p>

    <form method="POST" action="{{ url_for('auth.forgot_password_verify') }}" class="auth-form">
      <div class="form-group">
        <label for="recovery_code">Recovery Code</label>
        <div class="pw-wrap">
          <input type="password" id="recovery_code" name="recovery_code"
                 placeholder="4-digit code" autocomplete="off" required
                 minlength="4" maxlength="4" inputmode="numeric" pattern="[0-9]{4}">
          <button type="button" class="eye-btn" onclick="togglePw('recovery_code', this)">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-auth">Verify</button>
    </form>

    <p class="auth-switch">
      <a href="{{ url_for('auth.forgot_password') }}">← Start over</a>
    </p>

  </div>
</div>
{% endblock %}
