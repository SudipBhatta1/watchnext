{% extends "base.html" %}
{% block title %}Forgot Password — WatchNext{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <span class="logo-play">▶</span>
      <span class="logo-text">WatchNext</span>
    </div>

    <h1 class="auth-title">Forgot your password?</h1>
    <p class="auth-sub">Enter your username or email to get started.</p>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="auth-form">
      <div class="form-group">
        <label for="identifier">Username or Email</label>
        <input type="text" id="identifier" name="identifier"
               placeholder="Enter your username or email"
               autocomplete="username" required>
      </div>
      <button type="submit" class="btn-auth">Continue</button>
    </form>

    <p class="auth-switch">
      Remembered it? <a href="{{ url_for('auth.login') }}">Back to log in</a>
    </p>

  </div>
</div>
{% endblock %}
