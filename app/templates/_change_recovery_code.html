  <div class="admin-table-section" style="max-width:420px">
    <h2>🔑 Change Recovery Code</h2>
    <p style="color:#666;font-size:.9rem;margin:.25rem 0 1rem">
      Used to reset your password if you ever forget it.
    </p>
    <form method="POST" action="{{ url_for('user.change_recovery_code') }}" class="auth-form">
      <div class="form-group">
        <label for="current_password">Current Password</label>
        <div class="pw-wrap">
          <input type="password" id="current_password" name="current_password"
                 required autocomplete="current-password">
          <button type="button" class="eye-btn" onclick="togglePw('current_password',this)">👁</button>
        </div>
      </div>
      <div class="form-group">
        <label for="new_recovery_code">New Recovery Code (4 numbers)</label>
        <div class="pw-wrap">
          <input type="password" id="new_recovery_code" name="recovery_code"
                 required minlength="4" maxlength="4" inputmode="numeric" pattern="[0-9]{4}"
                 placeholder="e.g. 4821" autocomplete="off">
          <button type="button" class="eye-btn" onclick="togglePw('new_recovery_code',this)">👁</button>
        </div>
      </div>
      <div class="form-group">
        <label for="confirm_recovery_code">Confirm New Code</label>
        <div class="pw-wrap">
          <input type="password" id="confirm_recovery_code" name="recovery_code_confirm"
                 required minlength="4" maxlength="4" inputmode="numeric" pattern="[0-9]{4}"
                 autocomplete="off">
          <button type="button" class="eye-btn" onclick="togglePw('confirm_recovery_code',this)">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-primary">Update Recovery Code</button>
    </form>
  </div>
