{% extends "base.html" %}
{% block title %}Set New Password — WatchNext{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <span class="logo-play">▶</span>
      <span class="logo-text">WatchNext</span>
    </div>

    <h1 class="auth-title">Set a new password</h1>
    <p class="auth-sub">Choose a new password for your account.</p>

    <form method="POST" action="{{ url_for('auth.forgot_password_reset') }}" class="auth-form">
      <div class="form-group">
        <label for="password">New Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password"
                 placeholder="At least 8 characters, 1 letter + 1 number"
                 autocomplete="new-password" required minlength="8">
          <button type="button" class="eye-btn" onclick="togglePw('password',this)">👁</button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <div class="pw-wrap">
          <input type="password" id="confirm_password" name="confirm_password"
                 placeholder="Repeat your new password"
                 autocomplete="new-password" required>
          <button type="button" class="eye-btn" onclick="togglePw('confirm_password',this)">👁</button>
        </div>
        <span class="form-hint" id="matchHint"></span>
      </div>

      <button type="submit" class="btn-auth">Reset Password</button>
    </form>

  </div>
</div>

<script>
const pw  = document.getElementById('password');
const cf  = document.getElementById('confirm_password');
const hint = document.getElementById('matchHint');
function checkMatch() {
  if (!cf.value) { hint.textContent = ''; return; }
  if (pw.value === cf.value) { hint.textContent = '✓ Passwords match'; hint.style.color = '#16a34a'; }
  else { hint.textContent = '✗ Passwords do not match'; hint.style.color = '#e63946'; }
}
pw.addEventListener('input', checkMatch);
cf.addEventListener('input', checkMatch);
</script>
{% endblock %}
